<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>n-Back Game</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
    }
    #game-container {
      margin: 20px auto;
      width: 300px;
    }
    #grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 10px;
      margin-top: 20px;
    }
    .cell {
      width: 80px;
      height: 80px;
      border: 2px solid black;
      background-color: white;
    }
    #match-box {
      position: absolute;
      bottom: 50px;
      right: 50px;
      width: 100px;
      height: 50px;
      background-color: green;
      color: white;
      display: none;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .hidden {
      display: none;
    }
    #start-btn {
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <label for="n-value">Enter n: </label>
    <input type="number" id="n-value" min="1" />
    <button id="start-btn">Start</button>
    <div id="grid">
      <div class="cell" id="cell-0"></div>
      <div class="cell" id="cell-1"></div>
      <div class="cell" id="cell-2"></div>
      <div class="cell" id="cell-3"></div>
      <div class="cell" id="cell-4"></div>
      <div class="cell" id="cell-5"></div>
      <div class="cell" id="cell-6"></div>
      <div class="cell" id="cell-7"></div>
      <div class="cell" id="cell-8"></div>
    </div>
    <div id="match-box" class="hidden">Match!</div>
  </div>
  <script>
    const MATCH_PERCENTAGE = 30; // Adjust this to change the % of n-back matches
    
    let nValue;
    let currentFlashes = [];
    let gameRunning = false;
    let flashIndex = -1;
    
    const startBtn = document.getElementById("start-btn");
    const nInput = document.getElementById("n-value");
    const matchBox = document.getElementById("match-box");
    const cells = Array.from(document.querySelectorAll(".cell"));

    startBtn.addEventListener("click", () => {
      nValue = parseInt(nInput.value);
      if (!isNaN(nValue) && nValue >= 1) {
        startGame();
      } else {
        alert("Please enter a valid value for n");
      }
    });

    function startGame() {
      gameRunning = true;
      currentFlashes = [];
      matchBox.classList.add("hidden");
      flashSequence(0);
    }

    function flashSequence(count) {
      if (count >= 30) {
        gameRunning = false;
        return;
      }
      
      if (count >= nValue && Math.random() * 100 < MATCH_PERCENTAGE) {
        flashIndex = currentFlashes[count - nValue]; // Force an n-back match
      } else {
        flashIndex = getRandomFlashIndex();
      }
      
      currentFlashes.push(flashIndex);
      flashCell(flashIndex);

      setTimeout(() => {
        resetCell(flashIndex);
        if (checkMatch(count)) {
          showMatchBox();
        }
        setTimeout(() => {
          flashSequence(count + 1);
        }, 500);
      }, 2500);
    }

    function getRandomFlashIndex() {
      let index;
      do {
        index = Math.floor(Math.random() * 9);
      } while (index === 4);
      return index;
    }

    function flashCell(index) {
      const cell = cells[index];
      cell.style.borderColor = "lightblue";
      cell.style.boxShadow = "0 0 15px rgba(173, 216, 230, 0.7)";
    }

    function resetCell(index) {
      const cell = cells[index];
      cell.style.borderColor = "black";
      cell.style.boxShadow = "none";
    }

    function checkMatch(count) {
      if (count >= nValue) {
        return currentFlashes[count] === currentFlashes[count - nValue];
      }
      return false;
    }

    function showMatchBox() {
      matchBox.style.display = "flex";
      setTimeout(() => {
        matchBox.style.display = "none";
      }, 1000);
    }
  </script>
</body>
</html>
